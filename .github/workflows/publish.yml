name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Senpi ships bundled dependencies that npm omits from the generated lockfile,
      # so npm ci rejects the same lockfile that npm install can resolve.
      - run: npm install
      - run: npm publish --access public --provenance
